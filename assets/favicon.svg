<!-- Spiis-mærket: kokkehuen tegnet i orange streg, uden farveklat bagved.
     Stregerne er gjort tykke med vilje – et ikon skal også kunne læses,
     når det står som en fane på 16 px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Spiis">
  <defs>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8823C"/>
      <stop offset="1" stop-color="#CE6023"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#s)" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(24 24) scale(1.16) translate(-24 -23.5)">
    <!-- pandebåndet -->
    <path d="M16.4 30.2v6.2c0 1.6 1.3 2.9 2.9 2.9h9.4c1.6 0 2.9-1.3 2.9-2.9v-6.2" stroke-width="3.6"/>
    <!-- selve huen -->
    <path d="M15.4 31.1c-4.4-.6-7.9-4.3-7.9-8.8 0-4.3 3.1-7.9 7.4-8.7C16.1 10.4 19.7 8.1 24 8.1s7.9 2.3 9.1 5.5c4.3.8 7.4 4.4 7.4 8.7 0 4.5-3.5 8.2-7.9 8.8" stroke-width="3.6"/>
    <!-- de tre folder -->
    <path d="M20.6 30.2v3.4M24 30.2v3.4M27.4 30.2v3.4" stroke-width="2.7"/>
  </g>
</svg>
