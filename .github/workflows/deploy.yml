name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/spiis-restaurant-site-hbq4ik
      - claude/zen-davinci-m2j0ah
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stempl filerne med versionsnummer, så browsere og telefoner aldrig
      # kan blande gammel og ny kode efter en opdatering (cache-sikring)
      - name: Version assets
        run: |
          V="${GITHUB_SHA::8}"
          sed -i "s/__V__/${V}/g" index.html admin.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHubs Pages-kø kan være langsom i perioder – vent op til 20 min.
          timeout: 1200000
